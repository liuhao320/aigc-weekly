name: Sync upstream

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: git remote add upstream https://github.com/miantiao-me/aigc-weekly

      - name: Fetch upstream
        run: git fetch upstream

      - name: Sync master from upstream
        run: |
          git checkout master
          git merge --ff-only upstream/master

      - name: Push to fork
        run: git push origin master
